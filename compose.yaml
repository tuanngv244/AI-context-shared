name: shared-context
x-backend: &backend
  build:
    context: .
    dockerfile: infra/docker/Dockerfile.backend
  networks: [internal]
  init: true
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  read_only: true
  tmpfs: [/tmp]
  restart: unless-stopped
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: sce
      POSTGRES_DB: sce
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U sce -d sce]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    command:
      [
        sh,
        -c,
        'printf "requirepass %s\nappendonly yes\nappendfsync always\n" "$$REDIS_PASSWORD" > /tmp/redis.conf; exec redis-server /tmp/redis.conf',
      ]
    volumes: [redis_data:/data]
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 5s
      retries: 20
    networks: [internal]
    restart: unless-stopped
  migrate:
    <<: *backend
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      SCE_RUNTIME_PASSWORD: ${SCE_RUNTIME_PASSWORD:?set SCE_RUNTIME_PASSWORD}
      SCE_WORKER_PASSWORD: ${SCE_WORKER_PASSWORD:?set SCE_WORKER_PASSWORD}
      SCE_SEED_DEMO: ${SCE_SEED_DEMO:-false}
    command:
      [
        sh,
        -c,
        'node dist/packages/db/src/migrate.js && if [ "$$SCE_SEED_DEMO" = "true" ]; then node dist/packages/db/src/seed.js; fi',
      ]
    depends_on:
      postgres: { condition: service_healthy }
    restart: 'no'
  api:
    <<: *backend
    environment:
      DATABASE_URL: ${API_DATABASE_URL:?set API_DATABASE_URL}
      API_HOST: 0.0.0.0
      AUTH_MODE: ${AUTH_MODE:-oidc}
      SCE_LOCAL_TOKEN: ${SCE_LOCAL_TOKEN:-}
      SCE_LOCAL_ORG_ID: ${SCE_LOCAL_ORG_ID:-}
      SCE_ALLOWED_ORIGIN: ${SCE_ALLOWED_ORIGIN:-}
      AUTH_ISSUER_URL: ${AUTH_ISSUER_URL:-}
      AUTH_JWKS_URL: ${AUTH_JWKS_URL:-}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:-sce}
    ports: ['127.0.0.1:8787:8787']
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          'fetch("http://127.0.0.1:8787/health/ready").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))',
        ]
      interval: 10s
      retries: 10
  worker:
    <<: *backend
    environment:
      DATABASE_URL: ${WORKER_DATABASE_URL:?set WORKER_DATABASE_URL}
      REDIS_URL: ${REDIS_URL:?set REDIS_URL}
    command: [node, dist/apps/worker/src/index.js]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
  dashboard:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.dashboard
    environment:
      SCE_API_INTERNAL_URL: http://api:8787
    ports: ['127.0.0.1:3000:3000']
    networks: [internal]
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp]
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped
networks:
  internal:
volumes:
  postgres_data:
  redis_data:
