name: checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build:dashboard
      - run: npm run test:memory-smoke
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - run: cp .env.example .env
      - run: docker compose up -d --build --wait
      - run: node --import tsx tests/compose-smoke.ts
      - if: always()
        run: docker compose logs --tail=100 && docker compose down
